# Netlify build settings for the Next.js app.
# These override the old dashboard settings from the plain HTML site
# (no build command, publish directory ".").
# Netlify detects Next.js and runs it with its Next.js runtime automatically.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"
